locale:
  preference: zh
shell:
  timeoutMs: 1200000
  maxOutputBytes: 20000
ui-theme:
  preference: system

subagent-model:
  provider: "proxy-cli"
  model: "gemini-3.8-flash-high"
  reasoningEffort: "high"
build-loop: {}
llm-deepseek:
  models:
    - id: deepseek-flash
      name: DeepSeek-V4.1-Flash
      description: Fast, efficient, and economical; suited to focused, routine, or
        parallel tasks.
      contextWindow: 300000
      inputModalities:
        - text
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
      description: Stronger agentic coding, knowledge, and difficult reasoning; suited
        to complex or quality-critical tasks at higher cost.
      contextWindow: 1000000
      inputModalities:
        - text
    - id: deepseek-v4-flash-vision-exp
      name: DeepSeek-V4-Flash-Vision-Exp
      contextWindow: 1000000
      inputModalities:
        - text
        - image
      imagePixelBudget: 640000
      imageMaxBytes: 1048576
dsh-better-sidebar:
  workspaceFence: false
  agentOpenTools: false
  browserAllowedLoopback: localhost:8081, localhost:8080, 127.0.0.1:8081
