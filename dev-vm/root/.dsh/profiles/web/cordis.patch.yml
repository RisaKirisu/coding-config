# Profile-owned rc.2 settings; editable fields remain writable through Web.
- id: llm-pi-ai
  config:
    providers:
      krill-codex:
        displayName: Krill OAI
        apiKeyEnv: KRILL_CODEX_API_KEY
        api: openai-responses
        baseURL: https://api.krill-code.net/codex/v1
        models:
          - id: gpt-6-astra
            contextWindow: 300000
            input:
              - text
              - image
            reasoningEfforts:
              off: low
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              chatTemplateKwargs: {}
              chatTemplateArgs: {}
          - id: gpt-6.1-sol
            name: gpt-6.1-sol
            input:
              - text
              - image
            reasoningEfforts:
              off: low
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              chatTemplateKwargs: {}
              chatTemplateArgs: {}
        modelOverrides: {}
        compat:
          chatTemplateKwargs: {}
          chatTemplateArgs: {}
        defaultContextWindow: 262144
        defaultMaxTokens: 32768
        defaultInput:
          - text
        headers: {}
        thinkingBudgets: {}
        streamIdleTimeoutMs: 300000
        maxRequestImageBytes: 20971520
        requestImagePixelBudget: 4194304
        requestImageMaxBytes: 1048576
      proxy-cli:
        apiKeyEnv: PROXY_CLI_API_KEY
