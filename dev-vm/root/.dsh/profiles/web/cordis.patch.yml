- id: llm-deepseek
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        description: Fast, efficient, and economical; suited to focused, routine, or
          parallel tasks.
        contextWindow: 300000
        inputModalities:
          - text
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text
      - id: deepseek-v4-flash-vision-exp
        name: DeepSeek-V4-Flash-Vision-Exp
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        imagePixelBudget: 640000
        imageMaxBytes: 1048576
- id: agent-default-model
  config:
    provider: proxy-cli
    model: gpt-6.1-sol
    reasoningEffort: high
- id: ui-settings-general
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-preset-registry
  config:
    default: standard-bash
    selectedDefault: standard-bash
- id: ui-conversation
  config:
    busyEnter: steer
- id: locale
  config:
    preference: zh
- id: ui-theme
  config:
    preference: system
- id: subagent-manager
  config:
    provider: proxy-cli
    model: gpt-6.1-sol
    reasoningEffort: medium
- id: build-loop
  config: {}
- id: better-sidebar
  config:
    agentOpenTools: false
- id: thinking-effort
  config:
    opencodeSession:
      providers:
        proxy-cli:
          models: {}
    subagentEffort: ""
- id: subagent-model-selection-settings
  config:
    enabled: false
    allowedModels: []
- id: ui-sidebar-browser
  disabled: true

# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-permission
  disabled: true

# >>> dsh-skill-mcp-panel:mcp:begin
- insert:
    - id: panel-mcp-context7
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: context7
        toolCallTimeoutMs: 60000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
        transport: streamable-http
        url: https://mcp.context7.com/mcp
        headers:
          Authorization: !!js (() => { const token =
            process.env.MCP_636F6E7465787437_TOKEN; if (!token) throw new
            Error('Missing MCP authentication environment variable
            MCP_636F6E7465787437_TOKEN'); return 'Bearer ' + token; })()
- id: model-fallback
  name: "@devvm/dsh-model-fallback"
  config:
    fallbacks:
      - provider: krill-codex
        model: gpt-6.1-sol
        reasoningEffort: high
    retriableErrors:
      - code: PI_AI_ERROR
        messageContains: stream disconnected before completion
        treatAs: TRANSPORT

# <<< dsh-skill-mcp-panel:mcp:end
