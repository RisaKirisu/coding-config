- id: llm-deepseek
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        description: Fast, efficient, and economical; suited to focused, routine, or
          parallel tasks.
        contextWindow: 300000
        inputModalities:
          - text
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text
      - id: deepseek-v4-flash-vision-exp
        name: DeepSeek-V4-Flash-Vision-Exp
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        imagePixelBudget: 640000
        imageMaxBytes: 1048576
- id: agent-default-model
  config:
    provider: krill-codex
    model: gpt-6.1-sol
    reasoningEffort: high
- id: compaction-basic
  config:
    thresholdRatio: 0.5
    maxTokens: 10000
    compactionRetries: 5
    maxOverflowRetries: 5
- id: tool-result-pruner
  config:
    thresholdChars: 8192
    headChars: 2048
    tailChars: 1024
- id: tool-web
  disabled: false
  config:
    search: false
    fetch: true
    searchTimeoutMs: 60000
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    agentOptions:
      provider: krill-codex
      model: gpt-6.1-sol
      reasoningEffort: high
