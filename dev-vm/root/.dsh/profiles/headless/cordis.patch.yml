    providers:
      krill-codex:
        displayName: Krill
        apiKeyEnv: KRILL_CODEX_API_KEY
        api: openai-responses
        baseURL: https://api.krill-code.net/codex/v1
        models:
          - id: gpt-6-astra
            contextWindow: 300000
            input:
              - text
              - image
            reasoningEfforts:
              off: low
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
