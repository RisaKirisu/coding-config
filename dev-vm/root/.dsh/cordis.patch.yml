- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: sandbox
  disabled: true

- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

- id: permission
  disabled: true

- id: approval
  disabled: true

- insert:
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'
      config:
        timeoutMs: 60000

    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'

    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
        headers:
          Authorization: !!js >-
            `Bearer ${(() => {
              try {
                const fs = process.getBuiltinModule('node:fs');
                const text = fs.readFileSync(dshHomePath('.credentials.yaml'), 'utf8');
                const m = text.match(/^\s*CONTEXT7_API_KEY:\s*['"]?([^'"\r\n]+)/m);
                return m ? m[1].trim() : (process.env.CONTEXT7_API_KEY ?? '');
              } catch {
                return process.env.CONTEXT7_API_KEY ?? '';
              }
            })()}`

    # Local plugin paths resolve from profiles/<name>, not from DSH_HOME.
    - id: tool-voice-input
      name: ../../plugins/voice-input/index.mjs
      config:
        file: /root/voice-dictation-cleanup/data/archive_voice_input.jsonl
