- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

# PTC requires the service; danger-full-access above keeps execution unrestricted.
- id: sandbox
  disabled: false

- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

- id: permission
  disabled: true

- id: approval
  disabled: true

- insert:
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'
      config:
        timeoutMs: 1200000
        maxTimeoutMs: 1200000
        maxOutputBytes: 20000

    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'

- id: ui-conversation
  config:
    busyEnter: steer
