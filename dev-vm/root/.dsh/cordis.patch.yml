- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: sandbox
  disabled: true

- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

- id: permission
  disabled: true

- id: approval
  disabled: true

- id: compaction-basic
  config:
    thresholdRatio: 0.5
    maxTokens: 10000
    compactionRetries: 5
    maxOverflowRetries: 5

- id: tool-result-pruner
  config:
    thresholdChars: 8192
    headChars: 2048
    tailChars: 1024

- id: tool-web
  disabled: false
  config:
    search: false
    fetch: true

- insert:
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'
      config:
        timeoutMs: 60000

    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'

    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'
